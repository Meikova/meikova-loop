name: Build & Release Apps (Android APK, iOS IPA, Desktop EXE)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ===============================================================
  # 1. BUILD & RELEASE ANDROID APK
  # ===============================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk MashLoop.apk
          ls -lh MashLoop.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          name: "MashLoop Release ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}"
          draft: false
          prerelease: false
          make_latest: true
          files: MashLoop.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===============================================================
  # 2. BUILD & RELEASE IOS IPA
  # ===============================================================
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Add and Sync iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Build iOS Archive & Package IPA
        run: |
          cd ios/App
          # Build Xcode Archive without code signing (for AltStore, Sideloadly, TrollStore)
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          # Package Payload into .ipa
          mkdir -p ./build/Payload
          cp -r ./build/App.xcarchive/Products/Applications/App.app ./build/Payload/
          cd ./build
          zip -qr ../../../MashLoop.ipa Payload
          cd ../../..
          ls -lh MashLoop.ipa

      - name: Publish IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          name: "MashLoop Release ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}"
          draft: false
          prerelease: false
          make_latest: true
          files: MashLoop.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===============================================================
  # 3. BUILD & RELEASE WINDOWS DESKTOP
  # ===============================================================
  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          pip install pyinstaller pywebview uvicorn fastapi soundfile onnxruntime

      - name: Prepare Directories and Build Desktop Executable
        run: |
          if (-not (Test-Path "data\models")) { New-Item -ItemType Directory -Path "data\models" -Force }
          pyinstaller --noconfirm mashloop.spec

      - name: Compress Desktop Release
        run: |
          Compress-Archive -Path "dist\MashLoop\*" -DestinationPath "MashLoop-Windows.zip" -Force
          Get-Item MashLoop-Windows.zip | Select-Object Name, Length

      - name: Publish Windows Desktop to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          name: "MashLoop Release ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}"
          draft: false
          prerelease: false
          make_latest: true
          files: MashLoop-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===============================================================
  # 4. BUILD & RELEASE LINUX DESKTOP
  # ===============================================================
  build-linux:
    name: Build Linux Desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies for PyWebView
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgirepository1.0-dev gir1.2-webkit2-4.1

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pyinstaller pywebview uvicorn fastapi soundfile onnxruntime PyGObject

      - name: Prepare Directories and Build Desktop Executable
        run: |
          mkdir -p data/models
          pyinstaller --noconfirm mashloop.spec

      - name: Compress Desktop Release
        run: |
          tar -czvf MashLoop-Linux.tar.gz -C dist MashLoop
          ls -lh MashLoop-Linux.tar.gz

      - name: Publish Linux Desktop to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          name: "MashLoop Release ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}"
          draft: false
          prerelease: false
          make_latest: true
          files: MashLoop-Linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===============================================================
  # 5. BUILD & RELEASE MACOS DESKTOP
  # ===============================================================
  build-macos:
    name: Build macOS Desktop
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pyinstaller pywebview uvicorn fastapi soundfile onnxruntime pyobjc-framework-WebKit

      - name: Prepare Directories and Build Desktop App
        run: |
          mkdir -p data/models
          pyinstaller --noconfirm mashloop.spec

      - name: Compress macOS Desktop Release
        run: |
          if [ -d "dist/MashLoop.app" ]; then
            cd dist && zip -rq ../MashLoop-macOS.zip MashLoop.app && cd ..
          else
            cd dist && zip -rq ../MashLoop-macOS.zip MashLoop && cd ..
          fi
          ls -lh MashLoop-macOS.zip

      - name: Publish macOS Desktop to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          name: "MashLoop Release ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}"
          draft: false
          prerelease: false
          make_latest: true
          files: MashLoop-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
