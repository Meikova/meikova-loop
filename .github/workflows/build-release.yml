name: Build & Release Apps (Android APK, iOS IPA, Desktop EXE)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agents/**'
      - 'LICENSE'
      - '.gitignore'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ===============================================================
  # 1. BUILD & RELEASE ANDROID APK
  # ===============================================================
  build-android:
    name: Build Android APK
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[ci skip]') &&
      (
        startsWith(github.ref, 'refs/tags/v') ||
        contains(github.event.head_commit.message, '[build]') ||
        contains(github.event.head_commit.message, '[release]') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk MeikovaLoop.apk
          ls -lh MeikovaLoop.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          name: "Meikova Loop Release ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}"
          draft: false
          prerelease: false
          make_latest: true
          files: MeikovaLoop.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===============================================================
  # 2. BUILD & RELEASE IOS IPA
  # ===============================================================
  build-ios:
    name: Build iOS IPA
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[ci skip]') &&
      (
        startsWith(github.ref, 'refs/tags/v') ||
        contains(github.event.head_commit.message, '[build]') ||
        contains(github.event.head_commit.message, '[release]') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Add and Sync iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Build iOS Archive & Package IPA
        run: |
          cd ios/App
          # Build Xcode Archive without code signing (for AltStore, Sideloadly, TrollStore)
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          # Package Payload into .ipa
          mkdir -p ./build/Payload
          cp -r ./build/App.xcarchive/Products/Applications/App.app ./build/Payload/
          cd ./build
          zip -qr ../../../MeikovaLoop.ipa Payload
          cd ../../..
          ls -lh MeikovaLoop.ipa

      - name: Publish IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          name: "Meikova Loop Release ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}"
          draft: false
          prerelease: false
          make_latest: true
          files: MeikovaLoop.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===============================================================
  # 3. BUILD & RELEASE WINDOWS DESKTOP
  # ===============================================================
  build-windows:
    name: Build Windows Desktop
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[ci skip]') &&
      (
        startsWith(github.ref, 'refs/tags/v') ||
        contains(github.event.head_commit.message, '[build]') ||
        contains(github.event.head_commit.message, '[release]') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          pip install pyinstaller pywebview uvicorn fastapi soundfile onnxruntime

      - name: Prepare Directories and Build Desktop Executable
        run: |
          if (-not (Test-Path "data\models")) { New-Item -ItemType Directory -Path "data\models" -Force }
          pyinstaller --noconfirm meikova_loop.spec

      - name: Compress Desktop Release
        run: |
          Compress-Archive -Path "dist\MeikovaLoop\*" -DestinationPath "MeikovaLoop-Windows.zip" -Force
          Get-Item MeikovaLoop-Windows.zip | Select-Object Name, Length

      - name: Publish Windows Desktop to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          name: "Meikova Loop Release ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}"
          draft: false
          prerelease: false
          make_latest: true
          files: MeikovaLoop-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===============================================================
  # 4. BUILD & RELEASE LINUX DESKTOP
  # ===============================================================
  build-linux:
    name: Build Linux Desktop
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[ci skip]') &&
      (
        startsWith(github.ref, 'refs/tags/v') ||
        contains(github.event.head_commit.message, '[build]') ||
        contains(github.event.head_commit.message, '[release]') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies for PyWebView
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgirepository-2.0-dev libgirepository1.0-dev libcairo2-dev gir1.2-webkit2-4.1 gobject-introspection pkg-config

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip wheel setuptools
          # Install CPU torch to prevent pulling 10GB+ NVIDIA CUDA wheels on headless CI
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pyinstaller pywebview uvicorn fastapi soundfile onnxruntime PyGObject

      - name: Prepare Directories and Build Desktop Executable
        run: |
          mkdir -p data/models
          pyinstaller --noconfirm meikova_loop.spec

      - name: Compress Desktop Release
        run: |
          tar -czvf MeikovaLoop-Linux.tar.gz -C dist MeikovaLoop
          ls -lh MeikovaLoop-Linux.tar.gz

      - name: Publish Linux Desktop to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          name: "Meikova Loop Release ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}"
          draft: false
          prerelease: false
          make_latest: true
          files: MeikovaLoop-Linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===============================================================
  # 5. BUILD & RELEASE MACOS DESKTOP
  # ===============================================================
  build-macos:
    name: Build macOS Desktop
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[ci skip]') &&
      (
        startsWith(github.ref, 'refs/tags/v') ||
        contains(github.event.head_commit.message, '[build]') ||
        contains(github.event.head_commit.message, '[release]') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pyinstaller pywebview uvicorn fastapi soundfile onnxruntime pyobjc-framework-WebKit

      - name: Prepare Directories and Build Desktop App
        run: |
          mkdir -p data/models
          pyinstaller --noconfirm meikova_loop.spec

      - name: Compress macOS Desktop Release
        run: |
          if [ -d "dist/MeikovaLoop.app" ]; then
            cd dist && zip -rq ../MeikovaLoop-macOS.zip MeikovaLoop.app && cd ..
          else
            cd dist && zip -rq ../MeikovaLoop-macOS.zip MeikovaLoop && cd ..
          fi
          ls -lh MeikovaLoop-macOS.zip

      - name: Publish macOS Desktop to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          name: "Meikova Loop Release ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}"
          draft: false
          prerelease: false
          make_latest: true
          files: MeikovaLoop-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
