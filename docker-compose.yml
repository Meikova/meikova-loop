version: '3.8'

services:
  loop:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meikova-loop
    restart: unless-stopped
    ports:
      - "${PORT:-8765}:7860"
    environment:
      - PORT=7860
      - MEIKOVA_LOOP_PORT=7860
      - MEIKOVA_LOOP_HOST=0.0.0.0
      - MEIKOVA_LOOP_MULTIUSER=1
      - AUTO_TUNNEL=${AUTO_TUNNEL:-0}
    volumes:
      - ./data:/home/user/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/api/host-info"]
      interval: 30s
      timeout: 5s
      retries: 3
